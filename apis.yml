aid: gigs
name: Gigs
description: 'Gigs is the operating system for embedded telecom, giving any technology
  brand the ability to launch and operate mobile phone and data plans without becoming
  a mobile network operator. The Gigs Core API (base https://api.gigs.com) exposes
  REST resources for projects, plans, users, addresses, subscriptions, SIMs (eSIM and
  physical), devices, number portings and port-outs, add-ons, subscription changes,
  usage and usage balances, and vouchers, secured with per-project Bearer API keys.
  Gigs also ships Connect (a prebuilt embeddable checkout), integrated Payments, an
  Operator automation layer, a Dashboard, and a Svix-backed webhook/event stream. Backed
  by Ribbit Capital and Speedinvest.'
