model: project-scoped-environments
description: Gigs separates test from live using distinct projects rather than key
  prefixes. An organization can hold multiple projects (e.g. production, test, experiment),
  and each project issues its own API key. Testing is done against a non-production
  project's key so data never mixes with live connectivity.
environments:
- name: production
  description: Live project issuing real connectivity subscriptions.
- name: test
  description: Non-production project for integration testing.
- name: experiment
  description: Additional non-production project for experimentation.
