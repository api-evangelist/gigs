method: searched
source: https://developers.gigs.com/api/error-handling
docs:
- https://developers.gigs.com/api/error-handling
- https://developers.gigs.com/api/error-codes
format: custom-error-object
envelope:
  object: error
  fields:
  - name: type
    description: The type of the error returned (e.g. invalid, unauthenticated).
  - name: code
    description: Optional machine-readable description of the error, present for errors
      that can be handled programmatically.
  - name: message
    description: Human-readable description of the error.
  - name: hint
    description: Optional explanation of how to resolve the error.
  - name: documentation
    description: Optional list of documentation URLs relevant to the error.
  example:
    object: error
    type: invalid
    code: invalidIccid
    message: Invalid ICCID format.
    hint: Parameter iccid must match /^([0-9]{19}F?|[0-9]{20})$/i
    documentation:
    - https://developers.gigs.com/api/error-handling
principles:
  hierarchy_of_failure: Errors are surfaced in order of location and severity - headers,
    then URL path, then query/body - so a missing auth header returns 401 before any
    400 validation error.
  strictness: Requests that do not conform to the spec fail with a helpful message
    rather than being healed; unknown params, wrong types, malformed formats, and
    out-of-enum values all raise errors.
error_types:
- status: 400
  type: malformed
  description: The request has incorrect syntax, such as an unparseable JSON body.
- status: 401
  type: unauthenticated
  description: The request doesn't have the required credentials.
- status: 403
  type: permissionDenied
  description: The authenticated user doesn't have permissions to perform the request.
- status: 404
  type: notFound
  description: The requested resource doesn't exist.
- status: 400
  type: invalid
  description: A parameter value is invalid (wrong type, format, or not in the documented
    enum).
