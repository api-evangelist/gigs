note: Entity graph derived from the documented Gigs Core API resource surface and
  the create-a-subscription guide. id-prefixes captured where published (pln_, usr_);
  others marked unknown rather than invented.
entities:
- name: project
  domain: platform
  description: The top-level container for an organization's plans, users, and subscriptions;
    each project has its own API key. Path root - /projects/{project}/...
- name: plan
  id_prefix: pln_
  domain: catalog
  description: A purchasable connectivity plan with allowances (dataBytes, voiceSeconds,
    smsMessages), coverage, price, provider, simTypes (eSIM/pSIM), and validity.
- name: user
  id_prefix: usr_
  domain: customer
  description: An end customer of the project, with email, fullName, preferredLocale,
    birthday.
- name: userAddress
  domain: customer
  description: A postal address belonging to a user; required for some portings.
- name: subscription
  domain: connectivity
  description: An active connectivity subscription linking a user, a plan, and a SIM.
- name: sim
  domain: connectivity
  description: An eSIM or physical SIM provisioned for a subscription.
- name: device
  domain: connectivity
  description: A hardware device (by IMEI) that a SIM/subscription can be associated with.
- name: porting
  domain: numbering
  description: An inbound number-porting request bringing an existing phone number to a subscription.
- name: portOut
  domain: numbering
  description: An outbound port taking a number away from a subscription.
- name: subscriptionChange
  domain: connectivity
  description: A scheduled or immediate change to a subscription (e.g. plan change).
- name: subscriptionAddon
  domain: connectivity
  description: An add-on (e.g. data top-up) applied to a subscription.
- name: addon
  domain: catalog
  description: A purchasable add-on offered on top of a plan.
- name: usage
  domain: telemetry
  description: Usage records for a subscription (data/voice/sms).
- name: usageBalance
  domain: telemetry
  description: Remaining allowance balances for a subscription.
- name: voucher
  domain: commerce
  description: A promotional voucher code redeemable against a purchase.
